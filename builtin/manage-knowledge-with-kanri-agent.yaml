  synthesis_logic: |-
    # Kanri-Agent Operational Guide

    高品質な知識管理を維持するための実践的な運用ガイド。忘れがちなポイントと必須チェック項目を記載。

    ---

    ## 🚨 Critical: スキーマの最新性確認

    **Expertise は専門知識管理に特化した独自スキーマです。**

    ### 新規作成・編集前に必ず実行

    ```bash
    # 最新のスキーマ構造を確認
    kanri-agent schema --format example

    # YAML形式の詳細説明を確認
    kanri-agent schema --format yaml

    # 特定フィールドの説明
    kanri-agent schema --field metadata
    kanri-agent schema --field activation
    ```

    **⚠️ 重要**: スキーマは進化します。必ず最新の構造を確認してからYAMLを作成してください。

    ---

    ## ✅ 新規Expertise作成チェックリスト

    ### Phase 1: 作成前の確認

    - [ ] **再利用性の確認**: 3回以上使う可能性があるか？
    - [ ] **一般化可能性**: 特定のケースに依存していないか？
    - [ ] **既存Expertiseの重複チェック**: 類似の知識が既に存在しないか？
      ```bash
      kanri-agent list --tag <関連タグ>
      kanri-agent list --group <関連グループ>
      ```

    ### Phase 2: ファイル作成

    - [ ] **Markdownファイルとして作成** (`.md` または `.txt`)
    - [ ] **明確なタイトルとセクション構造**
    - [ ] **実装例・コード例を含める** (該当する場合)
    - [ ] **参照実装の位置を記載** (`ファイル名:行番号` 形式)

    ### Phase 3: kanri-agentへの登録

    ```bash
    kanri-agent new <id> \
      --file <path/to/file.md> \
      --scope <personal|company|project|admin> \
      --group <hierarchical/group/path>
    ```

    **必須確認項目:**

    - [ ] **ID命名規則**: kebab-case、意味が明確、検索しやすい
      - ✅ `rate-limit-retry-pattern`
      - ✅ `api-integration-guide`
      - ❌ `pattern1`, `helper`, `tmp`

    - [ ] **Scope選択**:
      - `personal`: 個人実験、まだ汎用化できていないパターン
      - `company`: チーム共有のベストプラクティス
      - `project`: 特定プロジェクト固有の知識
      - `admin`: 公式ドキュメント（kanri-agent本体のガイド等）

    - [ ] **Group設定**: 階層的に意味のある分類
      - 第1層: 目的 (`implementation`, `code-review`, `investigation`)
      - 第2層: カテゴリ (`patterns`, `guide`, `planning`)
      - 第3-4層: 技術詳細 (`http/retry`, `error-handling/gateway`)

    ### Phase 4: タグ設定（🚨 忘れがち！）

    **作成直後に必ず実行:**

    ```bash
    kanri-agent tag <id> set \
      <機能タグ> <技術タグ> <領域タグ> <用途タグ>
    ```

    **タグ設計の5原則:**

    1. **機能タグ**: `implementation`, `code-review`, `investigation`
    2. **技術タグ**: `kotlin`, `typescript`, `http`, `api`
    3. **領域タグ**: `integration`, `gateway`, `client`
    4. **用途タグ**: `patterns`, `guide`, `orchestrator`
    5. **プロジェクトタグ**: プロジェクト固有の場合のみ

    **最低3つ、最大10個程度が適切**

    - [ ] タグを設定した
    - [ ] タグが検索性を考慮している
    - [ ] タグが多すぎない（10個以下）

    ### Phase 5: activation.contexts 設定（🚨 忘れがち！）

    **YAMLを直接編集してcontextsを設定:**

    ```bash
    kanri-agent edit <id>
    ```

    ```yaml
    activation:
      mode: skill  # または command, both
      auto: false
      contexts:    # 🚨 これを忘れずに！
        - personal  # このExpertiseが有効なscope
        - company
    ```

    **Contexts設定ルール:**
    - Scopeが `personal` → contexts: `[personal]`
    - Scopeが `company` → contexts: `[company, personal]` (personalでも使える場合)
    - Scopeが `admin` → contexts: `[admin, personal, company, project]` (全scopeで利用可能)

    - [ ] `activation.contexts` を設定した
    - [ ] Scopeとcontextsの関係が適切

    ### Phase 6: デプロイ前の品質チェック

    ```bash
    # Expertiseの内容確認
    kanri-agent show <id>
    ```

    **確認項目:**

    - [ ] **メタデータ完全性**:
      - [ ] `scope` が適切
      - [ ] `visibility` が設定済み（private/team/public）
      - [ ] `groups` が階層的に展開されている
      - [ ] `tags` が3個以上設定されている
      - [ ] `author` が正しい

    - [ ] **Activation設定**:
      - [ ] `mode` が適切（skill/command/both）
      - [ ] `contexts` が設定されている（🚨重要）
      - [ ] `auto` の値が意図通り

    - [ ] **Body（本体）**:
      - [ ] `synthesis_logic` が意味のある内容
      - [ ] コード例がある（該当する場合）
      - [ ] 参照実装の位置が記載されている（該当する場合）

    ### Phase 7: デプロイ

    ```bash
    # ローカルにデプロイ（テスト）
    kanri-agent deploy --target local

    # グローバルにデプロイ（本番）
    kanri-agent clean --target global
    kanri-agent deploy --target global
    ```

    - [ ] ローカルでテストした
    - [ ] Claude Codeで正しく動作することを確認
    - [ ] グローバルにデプロイした

    ---

    ## 🔄 既存Expertise更新時のチェックリスト

    ### 更新前

    - [ ] 現在のバージョンを確認
      ```bash
      kanri-agent version <id> list
      ```

    ### 更新作業

    ```bash
    kanri-agent edit <id>
    ```

    - [ ] 変更内容を記録（コミットメッセージのように）
    - [ ] メタデータの `updated` が自動更新されることを確認

    ### バージョンアップ

    ```bash
    # Patch: バグ修正・誤字修正
    kanri-agent version <id> bump --level patch

    # Minor: 機能追加・セクション追加
    kanri-agent version <id> bump --level minor

    # Major: 破壊的変更・構造の大幅変更
    kanri-agent version <id> bump --level major
    ```

    **バージョニング判断基準:**
    - `patch (0.0.X)`: 誤字修正、コメント追加、軽微な改善
    - `minor (0.X.0)`: 新しいセクション追加、例の追加、後方互換性あり
    - `major (X.0.0)`: 構造変更、削除、後方互換性なし

    - [ ] 適切なレベルでバージョンアップした
    - [ ] デプロイを実行した

    ---

    ## 🚨 忘れがちなポイント Top 5

    ### 1. タグの設定忘れ

    **症状**: `kanri-agent list --tag <tag>` で見つからない

    **対策**:
    ```bash
    # タグを確認
    kanri-agent tag <id> list

    # タグがない場合は追加
    kanri-agent tag <id> set <tag1> <tag2> <tag3>
    ```

    ### 2. activation.contexts の設定忘れ

    **症状**: デプロイしたのにClaude Codeで使えない

    **対策**:
    ```bash
    kanri-agent edit <id>
    # activation.contexts を追加
    ```

    ### 3. グループの階層展開忘れ

    **症状**: `kanri-agent list --group <親グループ>` で見つからない

    **対策**:
    ```bash
    # グループを確認
    kanri-agent group <id> list

    # 階層が展開されていない場合は再設定
    kanri-agent group <id> set <hierarchical/path>
    ```

    ### 4. デプロイ後のclean忘れ

    **症状**: 古いバージョンのSkill/Commandが残っている

    **対策**:
    ```bash
    # デプロイ前に必ずclean
    kanri-agent clean --target global
    kanri-agent deploy --target global
    ```

    ### 5. スキーマ確認忘れ

    **症状**: YAMLが古い形式で動作しない

    **対策**:
    ```bash
    # 最新スキーマを必ず確認
    kanri-agent schema --format example
    ```

    ---

    ## 📊 定期メンテナンス（推奨）

    ### 月次

    ```bash
    # 全Expertiseの確認
    kanri-agent list --scope company
    kanri-agent tree --scope company --by group

    # 未使用タグの確認
    kanri-agent tree --scope company --by tag
    ```

    - [ ] タグの一貫性チェック
    - [ ] グループ階層の整合性チェック
    - [ ] 古いExpertiseの更新確認

    ### 四半期

    - [ ] 重複Expertiseの統合
    - [ ] Tag/Groupの再編成
    - [ ] Visibility設定の見直し

    ---

    ## 🎯 品質基準

    ### 最低基準（すべてのExpertiseで満たすべき）

    - ✅ ID が意味のある名前
    - ✅ タグが3個以上
    - ✅ Groupが設定されている
    - ✅ activation.contexts が設定されている
    - ✅ synthesis_logic が空でない

    ### 推奨基準（高品質なExpertiseの条件）

    - ✅ 実装例・コード例がある
    - ✅ 参照実装の位置が記載されている
    - ✅ 関連Expertiseへのリンクがある
    - ✅ 適用場面が明確
    - ✅ 制約・注意事項が記載されている

    ---

    ## 🛠️ トラブルシューティング

    ### Expertiseが見つからない

    ```bash
    # 全scopeを検索
    kanri-agent list
    kanri-agent list --scope personal
    kanri-agent list --scope company
    kanri-agent list --scope project
    kanri-agent list --scope admin

    # ID直接指定
    kanri-agent show <id>
    ```

    ### デプロイしたのに反映されない

    1. Cleanしてから再デプロイ
       ```bash
       kanri-agent clean --target global
       kanri-agent deploy --target global
       ```

    2. Claude Codeを再起動

    3. デプロイ先を確認
       ```bash
       ls ~/.claude/skills/
       ls ~/.claude/commands/
       ```

    ### YAMLパースエラー

    1. 最新スキーマと比較
       ```bash
       kanri-agent schema --format example
       ```

    2. 必須フィールドの確認
       - `id`, `version`, `name`, `description`
       - `metadata.scope`, `metadata.author`
       - `activation.mode`, `activation.contexts`
       - `body.synthesis_logic`

    ---

    ## 📚 クイックリファレンス

    ### よく使うコマンド

    ```bash
    # スキーマ確認（最重要）
    kanri-agent schema --format example

    # 新規作成
    kanri-agent new <id> --file <file> --scope <scope> --group <group>

    # タグ設定
    kanri-agent tag <id> set <tag1> <tag2> <tag3>

    # 確認
    kanri-agent show <id>
    kanri-agent list --scope <scope>
    kanri-agent tree --by group

    # 編集
    kanri-agent edit <id>

    # バージョン管理
    kanri-agent version <id> list
    kanri-agent version <id> bump --level patch|minor|major

    # デプロイ
    kanri-agent clean --target global
    kanri-agent deploy --target global
    ```

    ---

    ## 🎓 まとめ: 最も重要な3つのこと

    1. **スキーマは必ず最新を確認** → `kanri-agent schema --format example`
    2. **タグとcontextsを忘れずに設定** → 検索性と利用可能性の基盤
    3. **デプロイ前にclean** → 古いバージョンとの競合を防止

    この3つを守れば、高品質な知識管理が実現できます。
